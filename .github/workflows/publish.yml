name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify release tag matches package version
        run: node -e 'const v = require("./package.json").version; if (process.env.GITHUB_REF_NAME !== `v${v}`) throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match v${v}`)'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:boundary
      - run: npm publish
